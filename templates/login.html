<!DOCTYPE html>
<html lang="en">
    {% load static %}

<head>

		<!-- Meta Tags -->
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Tau Research LTD">
        <meta name="keywords" content="Tau Research LTD">
        <meta name="author" content="Tau Research LTD">
        <meta name="robots" content="index, follow">
        <title>Tau Research LTD</title>
    
		
		<script src="{% static 'assets/js/theme-script.js' %}" type="0a2b2b056e66d5239437cefa-text/javascript"></script>

		<!-- Favicon -->
        <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/img/logo.svg' %}">

		<!-- Apple Touch Icon -->
		<link rel="apple-touch-icon" sizes="180x180" href="{% static 'assets/img/logo.svg' %}">
		
		<!-- Bootstrap CSS -->
        <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
		
        <!-- Fontawesome CSS -->
		<link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/fontawesome.min.css' %}">
		<link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/all.min.css' %}">

         <!-- Tabler Icon CSS -->
	    <link rel="stylesheet" href="{% static 'assets/plugins/tabler-icons/tabler-icons.css' %}">
		

	    <!-- Main CSS -->
        <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
		
    </head>
    <body class="account-page bg-white">

        <div id="global-loader" >
			<div class="whirly-loader"> </div>
		</div>
	
		<!-- Main Wrapper -->
        <div class="main-wrapper">
			<div class="account-content">
				<div class="login-wrapper login-new">
                    <div class="row w-100">
                        <div class="col-lg-5 mx-auto">
                            <div class="login-content user-login">
                                <div class="login-logo">
                                    <img src="{% static 'assets/img/logo.svg' %}" alt="img" height="200" width="200">
                                    <a href="#" class="login-logo logo-white">
                                        <img src="{% static 'assets/img/logo.svg' %}"  alt="Img">
                                    </a>
                                </div>
                                <form action="{% url 'dashboard' %}">
                                    <div class="card">
                                        <div class="card-body p-5">
                                            <div class="login-userheading">
                                                <h3>Login</h3>
                                            </div>
                                           
                                            <div class="mb-3">
                                                <label class="form-label">Email <span class="text-danger"> *</span></label>
                                                <div class="input-group">
                                                    <input type="text" value="" class="form-control border-end-0">
                                                    <span class="input-group-text border-start-0">
                                                        <i class="ti ti-mail"></i>
                                                    </span>
                                                </div>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Password <span class="text-danger"> *</span></label>
                                                <div class="pass-group">
                                                    <input type="password" class="pass-input form-control">
                                                    <span class="ti toggle-password ti-eye-off text-gray-9"></span>
                                                </div>
                                            </div>
                                            
                                           
                                            <div class="form-login">
                                                <button type="submit" class="btn btn-login">Login</button>
                                            </div>
                                            
                                         
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div class="my-4 d-flex justify-content-center align-items-center copyright-text">
                                <p>Copyright &copy; Tau Research LTD</p>
                            </div>
                        </div>
                    </div>
                </div>
			</div>
        </div>
		<!-- /Main Wrapper -->
		  

		<!-- jQuery -->
        <script src="{% static 'assets/js/jquery-3.7.1.min.js' %}" type="0a2b2b056e66d5239437cefa-text/javascript"></script>

         <!-- Feather Icon JS -->
		<script src="{% static 'assets/js/feather.min.js' %}" type="0a2b2b056e66d5239437cefa-text/javascript"></script>
		
		<!-- Bootstrap Core JS -->
        <script src="{% static 'assets/js/bootstrap.bundle.min.js' %}" type="0a2b2b056e66d5239437cefa-text/javascript"></script>
		
		<!-- Custom JS -->
<script src="{% static 'assets/js/script.js' %}" type="0a2b2b056e66d5239437cefa-text/javascript"></script>
